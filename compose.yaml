name: edge-agent-ros
x-runtime: &runtime
  image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
  pull_policy: never
  init: true
  logging:
    driver: local
    options: {max-size: "10m", max-file: "4"}
  environment: &environment
    ROS_DOMAIN_ID: ${EDGE_ROS_DOMAIN_ID:-72}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    GZ_PARTITION: edge_v1
    GZ_SIM_SYSTEM_PLUGIN_PATH: /opt/edge/lib/edge_sim
  stop_grace_period: 6s
services:
  map3d-init:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["map3d"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/mkdir", "-p", "/sources/map3d"]
    volumes:
      - module-sources:/sources
  map3d:
    <<: *runtime
    profiles: ["map3d"]
    depends_on:
      map3d-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 96
    tmpfs: [/tmp]
    environment:
      <<: *environment
      EDGE_MAP3D_ENV: simulation
      EDGE_MAP_CONSOLE_PORT: ${EDGE_CONSOLE_PORT:-8765}
      EDGE_MAP3D_BIND: 0.0.0.0
      EDGE_MAP3D_FRAME: ${EDGE_MAP3D_FRAME:-odom}
      ROS_LOG_DIR: /tmp/ros-logs
      EDGE_MAP3D_TOPIC: ${EDGE_MAP3D_TOPIC:-/edge/map3d/points}
      EDGE_MAP3D_GRID_TOPIC: ${EDGE_MAP3D_GRID_TOPIC:-/edge/perception/map}
      EDGE_MAP3D_POSE: ${EDGE_MAP3D_POSE:-/edge/perception/pose}
    command: ["python3", "-B", "/opt/edge/perception/map3d/provider.py", "--ros-args", "-p", "use_sim_time:=true"]
    volumes:
      - type: volume
        source: module-sources
        target: /journal
        volume: {subpath: map3d}
      - ${EDGE_MAP3D_INPUTS_DIR:-./map-inputs}:/etc/edge/map3d-inputs:ro
    ports:
      - "127.0.0.1:${EDGE_MAP3D_PORT:-8770}:8770"
  map3d-sensor:
    <<: *runtime
    profiles: ["map3d-sensor"]
    restart: unless-stopped
    stop_grace_period: 12s
    command: ["python3", "-B", "/opt/edge/perception/map3d/survey.py"]
  sim:
    <<: *runtime
    environment:
      <<: *environment
      EDGE_SCENE_FILE: ${EDGE_SCENE_FILE-/opt/edge/scene/campus.json}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${EDGE_BASE_IMAGE:-edge-agent-ros/base:jazzy-harmonic}
        EDGE_REVISION: ${EDGE_REVISION:-unknown}
    command: ["python3", "/opt/edge/scene/start_world.py"]
  bridge:
    <<: *runtime
    command: ["ros2", "run", "ros_gz_bridge", "parameter_bridge", "--ros-args", "-r", "__node:=edge_control_bridge", "-p", "config_file:=/opt/edge/sim/bridge.yaml"]
  witness:
    <<: *runtime
    command: ["ros2", "run", "ros_gz_bridge", "parameter_bridge", "--ros-args", "-r", "__node:=edge_witness_bridge", "-p", "config_file:=/opt/edge/sim/witness.yaml"]
  gateway:
    <<: *runtime
    command: ["ros2", "run", "edge_gateway", "edge_gateway_node", "--ros-args", "-p", "require_scan:=true"]
  core:
    <<: *runtime
    volumes:
      - state:/var/lib/edge-agent
    command: ["ros2", "run", "edge_core", "edge_core_node"]
  perception:
    <<: *runtime
    restart: unless-stopped
    command: ["python3", "/opt/edge/perception/node.py"]
  agent:
    <<: *runtime
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${EDGE_ROS_DOMAIN_ID:-72}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      EDGE_OLLAMA_URL: ${EDGE_OLLAMA_URL:-}
      EDGE_PLANNER_URL: ${EDGE_PLANNER_URL:-}
      EDGE_EXTRA_PLUGIN_DIR: ${EDGE_EXTRA_PLUGIN_DIR-/opt/edge/scene/plugins}
      EDGE_TRACE_CONTENT: ${EDGE_TRACE_CONTENT:-redacted}
      EDGE_RETRY_LIMIT: ${EDGE_RETRY_LIMIT:-7}
      EDGE_STEP_TIMEOUT: ${EDGE_STEP_TIMEOUT:-1800}
      EDGE_OLLAMA_MODEL: ${EDGE_OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - task-state:/var/lib/edge-tasks
      - ${EDGE_PLUGINS_DIR:-./plugins}:/etc/edge/plugins:ro
      - ${EDGE_CONTRACTS_DIR:-./contracts}:/etc/edge/contracts:ro
    command: ["python3", "/opt/edge/agent/service.py"]
  model:
    image: ${EDGE_MODEL_IMAGE:-ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592}
    restart: unless-stopped
    profiles: ["model"]
    volumes:
      - models:/root/.ollama
  session:
    <<: *runtime
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    entrypoint: ["python3", "/opt/edge/sessions_plugin/provider.py"]
    environment:
      EDGE_SESSION_SOURCE: http://console:8080
      EDGE_SESSION_JOURNAL: /var/lib/edge-session/session.default/module-events.sqlite
    volumes:
      - module-sources:/var/lib/edge-session
  session-admin:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["session-admin"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    entrypoint: ["python3", "/opt/edge/client/register_session.py"]
    volumes:
      - ${EDGE_PLUGINS_DIR:-./plugins}:/plugins
  evidence:
    <<: *runtime
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    entrypoint: ["python3", "/opt/edge/evidence/provider.py"]
    environment:
      EDGE_EVIDENCE_SOURCE: http://console:8080
      EDGE_EVIDENCE_JOURNAL: /var/lib/edge-evidence/evidence.query/module-events.sqlite
    volumes:
      - module-sources:/var/lib/edge-evidence
    ports:
      - "127.0.0.1:${EDGE_EVIDENCE_PORT:-8125}:8125"
  evidence-admin:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["evidence-admin"]
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    entrypoint: ["python3", "/opt/edge/client/register_evidence.py"]
    volumes:
      - ${EDGE_PLUGINS_DIR:-./plugins}:/plugins
  watchdog-init:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["watchdog"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/mkdir", "-p", "/state/watchdog"]
    volumes:
      - module-sources:/state
  watchdog:
    <<: *runtime
    profiles: ["watchdog"]
    depends_on:
      watchdog-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 96m
    tmpfs: [/tmp]
    entrypoint: ["python3", "/opt/edge/client/watchdog.py"]
    command: ["--agent-url","http://agent:8090","--console-url","http://console:8080"]
    volumes:
      - type: volume
        source: module-sources
        target: /state/watchdog
        volume:
          subpath: watchdog
  plugin-design-init:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["plugin-design"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/mkdir", "-p", "/sources/plugin.design", "/author/decisions"]
    volumes:
      - module-sources:/sources
      - author-proposals:/author
  plugin-design:
    <<: *runtime
    profiles: ["plugin-design"]
    depends_on:
      plugin-design-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    tmpfs: [/tmp]
    entrypoint: ["python3", "-B", "/opt/edge/client/plugin_design_watch.py"]
    command: ["--url", "http://console:8080", "--decisions", "/decisions", "--state", "/private",
              "--journal", "/journal/module-events.sqlite", "--contracts-dir", "/contracts",
              "--ollama-url", "${EDGE_DESIGN_MODEL_URL:-http://model:11434}", "--model", "${EDGE_DESIGN_MODEL:-qwen2.5:1.5b}"]
    volumes:
      - type: volume
        source: author-proposals
        target: /decisions
        read_only: true
        volume: {subpath: decisions}
      - type: volume
        source: module-sources
        target: /journal
        volume: {subpath: plugin.design}
      - design-private:/private
      - ${EDGE_DESIGN_CONTRACTS_DIR:-./contracts/design}:/contracts:ro
  software-author-init:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["software-author"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/mkdir", "-p", "/sources/plugin.software_author", "/design/drafts"]
    volumes:
      - module-sources:/sources
      - design-private:/design
  software-author:
    <<: *runtime
    profiles: ["software-author"]
    depends_on:
      software-author-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    tmpfs: [/tmp]
    entrypoint: ["python3", "-B", "/opt/edge/client/software_author_watch.py"]
    command: ["--url", "http://console:8080", "--drafts", "/drafts", "--state", "/private",
              "--journal", "/journal/module-events.sqlite", "--contract", "/contract.json",
              "--ollama-url", "${EDGE_CODE_MODEL_URL:-http://model:11434}", "--model", "${EDGE_CODE_MODEL:-qwen2.5:1.5b}"]
    volumes:
      - type: volume
        source: design-private
        target: /drafts
        read_only: true
        volume: {subpath: drafts}
      - type: volume
        source: module-sources
        target: /journal
        volume: {subpath: plugin.software_author}
      - software-author-private:/private
      - ${EDGE_CODE_CONTRACT:-./contracts/design/text-transform.json}:/contract.json:ro
  plugin-author:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["plugin-author", "plugin-manager"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    entrypoint: ["python3","/opt/edge/client/plugin_author_watch.py"]
    environment:
      EDGE_AUTHOR_EVENT_DB: /var/lib/edge-author-events/module-events.sqlite
    command: ["--url","http://console:8080","--out-dir","/proposals","--ollama-url","${EDGE_OLLAMA_URL:-http://model:11434}","--model","${EDGE_OLLAMA_MODEL:-qwen2.5:1.5b}"]
    volumes:
      - author-proposals:/proposals
      - author-events:/var/lib/edge-author-events
  plugin-manager:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["plugin-manager"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    entrypoint: ["python3","/opt/edge/client/plugin_manager_watch.py"]
    command: ["--url","http://console:8080","--policy","/etc/edge-policy/plugin-recovery.json","--proposals","/proposals","--registry","/plugins/derived","--state","/var/lib/edge-supervisor"]
    volumes:
      - author-proposals:/proposals:ro
      - supervisor-state:/var/lib/edge-supervisor
      - ${EDGE_PLUGINS_DIR:-./plugins}/derived:/plugins/derived
      - ${EDGE_RECOVERY_POLICY:-./policies/plugin-recovery.json}:/etc/edge-policy/plugin-recovery.json:ro
  plugin-admin:
    image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
    pull_policy: never
    profiles: ["plugin-admin"]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python3","/opt/edge/agent/plugin_manager.py"]
    command: ["--help"]
    volumes:
      - ${EDGE_PLUGINS_DIR:-./plugins}:/plugins
  scene:
    <<: *runtime
    environment:
      <<: *environment
      EDGE_SCENE_FILE: ${EDGE_SCENE_FILE-/opt/edge/scene/campus.json}
    restart: unless-stopped
    command: ["python3", "/opt/edge/scene/provider.py"]
    volumes:
      - scene-state:/var/lib/edge-scene
  console:
    <<: *runtime
    restart: unless-stopped
    environment:
      <<: *environment
      EDGE_TELEMETRY_RETENTION_DAYS: ${EDGE_TELEMETRY_RETENTION_DAYS:-7}
      EDGE_TELEMETRY_MAX_SAMPLES: ${EDGE_TELEMETRY_MAX_SAMPLES:-10080}
    command: ["python3", "/opt/edge/console/server/main.py"]
    volumes:
      - state:/var/lib/edge-agent:ro
      - console-history:/var/lib/edge-console
      - ${EDGE_OBSERVATIONS_DIR:-./observations}:/etc/edge/observations:ro
      - ${EDGE_CONSOLE_VIEWS_DIR:-./console/web/view-plugins}:/opt/edge/console/web/view-plugins:ro
      - task-state:/var/lib/edge-tasks:ro
      - author-events:/var/lib/edge-author-events:ro
      - supervisor-state:/var/lib/edge-supervisor:ro
      - module-sources:/var/lib/edge-module-sources:ro
      - ${EDGE_PLUGINS_DIR:-./plugins}:/etc/edge/plugins:ro
    ports:
      - "127.0.0.1:${EDGE_CONSOLE_PORT:-8765}:8080"
  probe:
    <<: *runtime
    profiles: ["validation"]
    volumes:
      - ${EDGE_EVIDENCE_DIR:-./artifacts/verification}:/evidence
    command: ["python3", "/opt/edge/tests/verify.py", "mission"]
volumes:
  software-author-private:
  design-private:
  supervisor-state:
  author-events:
  module-sources:
  author-proposals:
  scene-state:
  state:
  console-history:
  task-state:
  models:
