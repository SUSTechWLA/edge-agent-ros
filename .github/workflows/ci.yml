name: Edge CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      full_gazebo:
        description: 'Run full 3D Gazebo and multi-container simulation suite (requires high-CPU/GPU runner)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: SDD and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate specification and PR linkage
        run: python3 scripts/check_sdd.py --github-event "$GITHUB_EVENT_PATH"
      - name: Check contracts, boundaries and deployment descriptors
        run: |
          PYTHONPATH="$PWD" python3 tests/repository_contract.py -v
          PYTHONPATH="$PWD" python3 tests/document_contract.py -v
          PYTHONPATH="$PWD" python3 tests/test_package_boundaries.py -v
          PYTHONPATH="$PWD" python3 tests/planning_contract.py -v
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.hardware.yaml config --quiet

  simulation:
    name: ROS and Gazebo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EDGE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run deterministic verification on cloud runners or full Gazebo when requested
        run: |
          python3 -c "import numpy" 2>/dev/null || (sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends python3-numpy)
          if [ "${{ github.event.inputs.full_gazebo }}" = "true" ]; then
            python3 tests/system_suite.py
          else
            python3 tests/system_suite.py --stages repository planner
            node --test tests/map_planar.test.mjs tests/map_spatial.test.mjs
            PYTHONPATH="$PWD" python3 - <<'PY'
          import os, subprocess, tempfile
          from pathlib import Path
          from scripts import release_robot
          proj = release_robot.projection("HEAD")
          assert [p for p in proj if p.endswith(".md")] == ["README.md"]
          with tempfile.TemporaryDirectory(prefix="edge-ci-deploy-") as tmp:
              root = Path(tmp)
              for rel, (_, oid) in proj.items():
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(subprocess.check_output(["git", "cat-file", "blob", oid]))
              (root / "installed-sensors.json").write_text("{}", encoding="utf-8")
              env = dict(os.environ,
                         EDGE_CAL_HW_PROFILE=str(root / "installed-sensors.json"),
                         EDGE_CAL_HOST_GATEWAY="172.17.0.1",
                         EDGE_CAL_ROS_DOMAIN="61",
                         EDGE_CAL_OLLAMA_URL="http://172.17.0.1:11434",
                         EDGE_CAL_ROBOT_ID="jetson-ci")
              subprocess.check_call(["docker", "compose", "-f", "compose.hardware.yaml", "config", "--quiet"], cwd=root, env=env)
              subprocess.check_call([
                  "docker", "compose",
                  "-f", "compose.calibration-board.yaml",
                  "-f", "compose.calibration-console.yaml",
                  "-f", "compose.calibration-hardware.yaml",
                  "config", "--quiet",
              ], cwd=root, env=env)
          PY
          fi
      - name: Preserve this run's new evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ros-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, simulation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, main provenance and package version
        run: python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Create a draft for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --notes "Commit $(git rev-parse HEAD). CI and evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
