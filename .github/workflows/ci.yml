name: Edge CI

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'release/**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: SDD and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate specification and PR linkage
        run: python3 scripts/check_sdd.py --github-event "$GITHUB_EVENT_PATH"
      - name: Check contracts and deployment descriptors
        run: |
          python3 tests/repository_contract.py -v
          python3 tests/planning_contract.py -v
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.hardware.yaml config --quiet

  simulation:
    name: ROS and Gazebo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EDGE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build ROS image and exercise motion, cancellation and crash recovery
        shell: pwsh
        env:
          EDGE_VERIFY_ROOT: .ci-results/verification
        run: ./scripts/verify.ps1
      - name: Run console, replay and ROS observation contracts
        run: docker run --rm --network none edge-agent-ros:v0.1 python3 -m unittest discover -v -s /opt/edge/console/server
      - name: Run application event and tool contracts
        run: |
          docker run --rm --network none edge-agent-ros:v0.1 python3 /opt/edge/tests/agent_trace_contract.py -v
          docker run --rm --network none edge-agent-ros:v0.1 python3 -m unittest discover -v -s /opt/edge/tests -p 'test_*.py'
      - name: Verify restart, contention and plugin recovery in isolated Compose
        env:
          EDGE_RESILIENCE_REPORT: .ci-results/resilience.json
        run: python3 tests/console_resilience.py
      - name: Verify semantic missions through the public console
        env:
          COMPOSE_PROJECT_NAME: edge-ci-scene
          EDGE_CONSOLE_PORT: 8765
        run: |
          trap 'docker compose down --volumes --remove-orphans --timeout 3' EXIT
          sh scripts/deploy.sh sim start
          python3 tests/semantic_acceptance.py --out .ci-results/semantic.json
      - name: Preserve this run's new evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ros-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, simulation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, maintenance line and package version
        run: python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Create a draft for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --notes "Commit $(git rev-parse HEAD). CI and evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
