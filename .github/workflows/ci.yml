name: Edge CI

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'release/**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: SDD and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate specification and PR linkage
        run: python3 scripts/check_sdd.py --github-event "$GITHUB_EVENT_PATH"
      - name: Check contracts and deployment descriptors
        run: |
          python3 tests/repository_contract.py -v
          python3 tests/planning_contract.py -v
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.hardware.yaml config --quiet

  simulation:
    name: ROS and Gazebo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EDGE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run affected single-robot suites on PRs, full simulation on main and release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 tests/system_suite.py --changed-since "$BASE_SHA"
          else
            python3 tests/system_suite.py
          fi
      - name: Preserve this run's new evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ros-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, simulation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, maintenance line and package version
        run: python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Create a draft for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --notes "Commit $(git rev-parse HEAD). CI and evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
