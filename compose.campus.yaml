# Optional campus stack. The default project name keeps its networks and state volumes separate.
name: edge-agent-campus

x-campus-tool: &campus-tool
  image: ${EDGE_IMAGE:-edge-agent-ros:v0.1}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  init: true

x-campus-assets: &campus-assets
  type: bind
  source: ${EDGE_CAMPUS_ASSETS_DIR:-./artifacts/sim-assets}
  target: /assets
  read_only: true

x-campus-ready: &campus-ready
  campus-build:
    condition: service_completed_successfully

x-body-agent: &body-agent
  <<: *campus-tool
  depends_on: *campus-ready
  restart: unless-stopped
  command: ["python3","-B","/opt/edge/agent/service.py"]

x-body-env: &body-env
  ROS_LOCALHOST_ONLY: "1"
  ROS_LOG_DIR: /tmp/ros-logs
  EDGE_PLUGIN_DIR: /etc/edge/campus-empty
  EDGE_OLLAMA_URL: ""
  EDGE_PLANNER_URL: ""
  EDGE_TRACE_CONTENT: redacted

services:
  sensor-health:
    environment:
      EDGE_HEALTH_ROBOT_ID: ${EDGE_HEALTH_ROBOT_ID:-edge_rover}
      EDGE_HEALTH_RGB_TOPIC: ${EDGE_HEALTH_RGB_TOPIC-/model/edge_rover/rgbd/image_raw}
      EDGE_HEALTH_DEPTH_TOPIC: ${EDGE_HEALTH_DEPTH_TOPIC-/model/edge_rover/rgbd/depth/image_raw}
  campus-build:
    <<: *campus-tool
    network_mode: none
    volumes:
      - ./scene/campus_large:/opt/edge/scene/campus_large:ro
      - *campus-assets
      - campus-world:/campus
    command:
      - sh
      - -ec
      - |
        python3 -B /opt/edge/scene/campus_large/build.py --assets /assets --base /opt/edge/sim/world.sdf --output /campus
        python3 -B /opt/edge/scene/campus_large/robot_agent/catalog.py
        exec python3 -B /opt/edge/scene/campus_large/capture.py prepare

  sim:
    depends_on: *campus-ready
    environment:
      EDGE_SCENE_FILE: /campus/layout.json
      GZ_SIM_RESOURCE_PATH: /assets/models:/assets:/campus
    volumes:
      - ./scene/campus_large:/opt/edge/scene/campus_large:ro
      - *campus-assets
      - campus-world:/campus:ro
      - campus-runtime:/run/campus
    command: ["python3","-B","/opt/edge/scene/campus_large/capture.py","world"]

  scene:
    depends_on: *campus-ready
    environment:
      EDGE_SCENE_FILE: /campus/layout.json
    volumes:
      - campus-world:/campus:ro

  agent:
    depends_on: *campus-ready
    environment:
      EDGE_OLLAMA_URL: ""
      EDGE_PLANNER_URL: ""
      EDGE_TRACE_CONTENT: redacted
      EDGE_EXTRA_PLUGIN_DIR: /campus/agents/hub
    volumes:
      - campus-plugins:/etc/edge/plugins:ro
      - campus-contracts:/etc/edge/contracts:ro
      - campus-world:/campus:ro

  crazyflie-agent:
    <<: *body-agent
    environment: {<<: *body-env, EDGE_EXTRA_PLUGIN_DIR: /campus/agents/crazyflie}
    volumes: [campus-world:/campus:ro, crazyflie-tasks:/var/lib/edge-tasks]
  go1-agent:
    <<: *body-agent
    environment: {<<: *body-env, EDGE_EXTRA_PLUGIN_DIR: /campus/agents/go1}
    volumes: [campus-world:/campus:ro, go1-tasks:/var/lib/edge-tasks]
  g1-agent:
    <<: *body-agent
    environment: {<<: *body-env, EDGE_EXTRA_PLUGIN_DIR: /campus/agents/g1}
    volumes: [campus-world:/campus:ro, g1-tasks:/var/lib/edge-tasks]
  campus-robot-bridge:
    <<: *campus-tool
    depends_on: *campus-ready
    restart: unless-stopped
    environment: &robot-ros
      ROS_DOMAIN_ID: ${EDGE_ROS_DOMAIN_ID:-73}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      GZ_PARTITION: edge_v1
      ROS_LOG_DIR: /tmp/ros-logs
    volumes: [campus-world:/campus:ro]
    command: ["ros2","run","ros_gz_bridge","parameter_bridge","--ros-args","-p","config_file:=/campus/robot-bridge.yaml"]
  campus-fleet:
    <<: *campus-tool
    depends_on: *campus-ready
    restart: unless-stopped
    environment:
      <<: *robot-ros
      EDGE_CAMPUS_OVERVIEW_PORT: ${EDGE_CAMPUS_OVERVIEW_PORT:-8780}
    volumes: [campus-world:/campus:ro, campus-fleet-state:/state]
    command: ["python3","-B","/opt/edge/scene/campus_large/robot_agent/provider.py"]

  # The guarded reload closes task admission before its second check of the same owner ledger.
  campus-task-facts:
    <<: *campus-tool
    restart: unless-stopped
    entrypoint: ["python3","-B","/opt/edge/agent/facts_server.py"]
    environment: {EDGE_FACTS_BIND: 0.0.0.0}
    volumes: [task-state:/var/lib/edge-tasks:ro]

  console:
    depends_on: [campus-task-facts]
    environment:
      EDGE_FACTS_URL: http://campus-task-facts:8091
      EDGE_CAMPUS_MAP_PORT: ${EDGE_CAMPUS_MAP_PORT:-8773}
      EDGE_CAMPUS_OVERVIEW_PORT: ${EDGE_CAMPUS_OVERVIEW_PORT:-8780}
    ports: !override
      - "127.0.0.1:${EDGE_CAMPUS_CONSOLE_PORT:-8766}:8080"
    volumes:
      - campus-plugins:/etc/edge/plugins:ro
      - campus-observations:/etc/edge/observations:ro
      - campus-views:/opt/edge/console/web/view-plugins:ro

  # These optional roles have their own campus registries when explicitly enabled.
  evidence:
    profiles: [campus-evidence]
    ports: !override
      - "127.0.0.1:${EDGE_CAMPUS_EVIDENCE_PORT:-8126}:8125"
  session:
    profiles: [campus-session]
    depends_on:
      campus-session-init:
        condition: service_completed_successfully
  campus-session-init:
    <<: *campus-tool
    profiles: [campus-session]
    network_mode: none
    volumes: [campus-plugins:/plugins]
    entrypoint: ["python3","-B","/opt/edge/client/register_session.py","--if-missing"]
  evidence-admin:
    volumes: [campus-plugins:/plugins]
  session-admin:
    volumes: [campus-plugins:/plugins]
  plugin-admin:
    volumes: [campus-plugins:/plugins]
  plugin-manager:
    volumes: !override
      - author-proposals:/proposals:ro
      - supervisor-state:/var/lib/edge-supervisor
      - campus-plugins:/plugins
      - ./policies/plugin-recovery.json:/etc/edge-policy/plugin-recovery.json:ro
  campus-capture:
    <<: *campus-tool
    depends_on:
      <<: *campus-ready
      sim:
        condition: service_started
    environment:
      GZ_PARTITION: edge_v1
      GZ_HOMEDIR: /tmp
    volumes:
      - ./scene/campus_large:/opt/edge/scene/campus_large:ro
      - campus-world:/campus
      - campus-runtime:/run/campus:ro
    command: ["python3","-B","/opt/edge/scene/campus_large/capture.py","photos"]

  campus-overview:
    <<: *campus-tool
    depends_on: *campus-ready
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_CAMPUS_OVERVIEW_PORT:-8780}:8080"
    volumes: [campus-world:/campus:ro]
    command: ["python3","-B","-m","http.server","8080","--bind","0.0.0.0","--directory","/campus/overview"]

  campus-local-preview:
    <<: *campus-tool
    profiles: [campus-planning-preview]
    restart: unless-stopped
    entrypoint: ["python3","-B","-m","navigation.local_preview","--bind","0.0.0.0","--port","8129"]

  campus-texture:
    <<: *campus-tool
    profiles: [map3d]
    network_mode: none
    mem_limit: 1g
    environment:
      EDGE_CAMPUS_MAP_PORT: ${EDGE_CAMPUS_MAP_PORT:-8773}
    volumes:
      - ./scene/campus_large:/opt/edge/scene/campus_large:ro
      - *campus-assets
      - campus-world:/campus
      - campus-runtime:/run/campus:ro
      - campus-views:/views
    command: ["python3","-B","/opt/edge/scene/campus_large/install_map.py"]

  map3d:
    depends_on:
      campus-texture:
        condition: service_completed_successfully
    environment:
      EDGE_MAP_TEXTURE_DIR: /campus/texture
      EDGE_MAP_CONSOLE_PORT: ${EDGE_CAMPUS_CONSOLE_PORT:-8766}
      EDGE_MAP_ROBOTS_TOPIC: /edge/robot_states
    volumes:
      - campus-world:/campus:ro
      - campus-map-inputs:/etc/edge/map3d-inputs:ro
    ports: !override
      - "127.0.0.1:${EDGE_CAMPUS_MAP_PORT:-8773}:8770"

volumes:
  crazyflie-tasks:
  go1-tasks:
  g1-tasks:
  campus-fleet-state:
  campus-world:
  campus-runtime:
  campus-plugins:
  campus-contracts:
  campus-observations:
  campus-views:
  campus-map-inputs:
