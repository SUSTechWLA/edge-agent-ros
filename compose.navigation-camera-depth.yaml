# An Image reader for a depth image registered onto the approved CameraInfo optical grid.
services:
  spatial-facts:
    image: ${EDGE_NAV_IMAGE_READER_IMAGE:?pin the approved image reader and facts gateway}
    configs:
      - source: depth-fact-source
        target: /etc/edge/spatial-sources.d/depth.json
    volumes: [depth-facts:/depth-facts:ro]
  depth-reader:
    image: ${EDGE_NAV_IMAGE_READER_IMAGE:?pin the approved image reader}
    pull_policy: never
    profiles: [published]
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    tmpfs: [/tmp]
    pids_limit: 64
    mem_limit: 256m
    environment:
      ROS_DOMAIN_ID: ${EDGE_NAV_CAMERA_DOMAIN:?approved ROS domain}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_LOG_DIR: /tmp/ros
    command: [python3, -B, -m, perception.spatial_facts.image_capture, --stream, depth16,
              --actor-ref, "${EDGE_NAV_ACTOR:?approved actor}", --source-id, "${EDGE_NAV_DEPTH_SOURCE}",
              --topic, "${EDGE_NAV_DEPTH_TOPIC:?approved aligned depth Image topic}",
              --frame-id, "${EDGE_NAV_CAMERA_FRAME:?approved optical frame}", --calibration-dir, /camera-facts,
              --calibration-source, "${EDGE_NAV_CAMERA_SOURCE}", --output, /depth-facts]
    volumes: [camera-facts:/camera-facts:ro, depth-facts:/depth-facts]
volumes:
  depth-facts:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=400m,mode=0755"}
configs:
  depth-fact-source:
    content: '[{"source_id":"${EDGE_NAV_DEPTH_SOURCE:?approved depth source}","file":"/depth-facts/observations.json"}]'
