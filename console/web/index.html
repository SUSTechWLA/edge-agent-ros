<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>机器人观测台 · Edge Agent ROS</title>
<link rel="stylesheet" href="/app.css"><script src="/map.js" defer></script><script src="/app.js" defer></script>
</head><body>
<a href="#main" class="skip">跳至工作区</a>
<header class="topbar"><div class="brand"><svg viewBox="0 0 44 44" aria-hidden="true"><rect x="1" y="1" width="42" height="42" rx="12" fill="#d6fb80"/><path d="m10 26 12-17 12 17-12 8z" fill="#19352c"/><path d="m16 25 6-9 6 9-6 4z" fill="#d6fb80"/></svg><span>Edge Agent <b>ROS</b></span></div>
<nav class="tabs" aria-label="工作区"><a id="nav-live" href="#monitor" aria-current="page">实时监控</a><a id="nav-events" href="#events">事件记录</a></nav>
<div class="connection"><span class="pip" id="conn-pip"></span><span id="conn">连接中</span></div></header>
<main id="main">
<div class="heading"><div><p class="context"><span class="env-icon" aria-hidden="true">◈</span><span id="env">ROS 2</span><span class="slash">/</span><span id="robot">Edge</span></p><h1 id="page-title">机器人观测台</h1></div><div class="heading-right"><div class="clock"><span id="clock-label">状态更新时间</span><strong id="clock">—</strong></div><button id="open-task" class="primary">＋ 下发任务</button></div></div>
<aside id="history-bar" class="history-bar" hidden><span id="history-msg"></span><button id="resume">返回实时</button></aside>
<div id="notice" role="status" class="notice" hidden></div>
<section id="monitor" aria-label="实时监控">
<div class="metrics"><div class="metric"><span>融合位置 <small>m</small></span><strong id="metric-pos">—</strong></div><div class="metric"><span>航向角 <small>°</small></span><strong id="metric-yaw">—</strong></div><div class="metric"><span>轮式里程计速度 <small>m/s</small></span><strong id="metric-speed">—</strong></div><div class="metric"><span>当前动作</span><strong class="op" id="metric-action">—</strong></div></div>
<div class="workspace">
<section class="panel map-panel"><div class="panel-header"><div class="panel-label"><i class="glyph" data-icon="map"></i><h2>环境地图</h2></div><span id="map-frame" class="tag mono">—</span></div>
<div class="map-stage" id="map-stage"><canvas id="map" aria-label="机器人位置、轨迹、激光命中点与占据栅格地图"></canvas><div id="map-empty" class="canvas-empty">等待位置或地图数据</div><div class="map-tools"><button id="zoom-in" aria-label="放大地图" title="放大地图">+</button><button id="zoom-out" aria-label="缩小地图" title="缩小地图">−</button><button id="fit" aria-label="适应地图" title="适应地图">⌖</button></div><div class="scale"><i id="scale-line"></i><span id="scale-text">1 m</span></div></div>
<div id="scene-info" class="scene-info" hidden><span id="scene-zone"></span><span id="scene-source"></span></div><div class="layer-list" id="layer-list"><label id="semantics-label" hidden><input type="checkbox" data-layer="semantics" checked><i class="sym zone"></i>先验分区与地标</label><label><input type="checkbox" data-layer="grid" checked><i class="sym grid"></i>实测占据栅格</label><label><input type="checkbox" data-layer="scan" checked><i class="sym hit"></i>实测激光点</label><label><input type="checkbox" data-layer="trail" checked><i class="sym path"></i>融合轨迹</label><label id="truth-label"><input type="checkbox" data-layer="truth"><i class="sym truth"></i>仿真真值</label></div><p id="map-notes" class="panel-note"></p></section>
<div class="side">
<section class="panel sensor-panel"><div class="panel-header"><div class="panel-label"><i class="glyph" data-icon="scan"></i><h2>传感器原始输入</h2></div></div>
<div class="segments" aria-label="选择原始输入"><button data-sensor="scan" aria-pressed="true">激光雷达</button><button data-sensor="imu" aria-pressed="false">IMU</button><button data-sensor="odom" aria-pressed="false">里程计</button></div>
<label class="extra-select" id="extra-picker" hidden>扩展传感器<select id="extra-sensor"><option value="">选择传感器</option></select></label>
<div class="source-meta"><code id="raw-topic">/scan</code><span id="raw-health" class="badge">等待数据</span></div>
<div id="raw-body"><canvas id="polar" aria-label="雷达原始极坐标扫描，朝向上方"></canvas><div id="raw-values"></div></div>
<div class="sensor-fields" id="raw-fields"></div><p class="preview-note" id="raw-warning" hidden></p><details class="payload"><summary>查看当前采样</summary><pre id="raw-json"></pre></details></section>
<section class="panel fusion-panel"><div class="panel-header"><div class="panel-label"><i class="glyph" data-icon="layers"></i><h2>融合感知</h2></div><span id="fusion-health" class="badge">等待数据</span></div><div class="fusion-body"><p id="fusion-desc">融合位姿与局部占据栅格</p><dl id="fusion-fields"></dl></div></section>
</div></div>
<section class="panel task-panel" id="task-panel" hidden><div class="panel-header"><div class="panel-label"><i class="glyph" data-icon="task"></i><h2>最近下发的任务</h2></div><div><button id="trace-task">查看事件</button> <button id="refresh-task">刷新结果</button></div></div><div id="task-status" class="task-status"></div></section>
<section class="panel recent"><div class="panel-header"><div class="panel-label"><i class="glyph" data-icon="activity"></i><h2>最近事件</h2></div><a class="more" href="#events">查看事件记录 →</a></div><div id="recent-rows"></div></section>
</section>
<section id="events" aria-label="持久化事件记录" hidden><div class="panel"><div class="filters"><label>自然语言任务 ID<input type="search" id="task-filter" placeholder="全部任务"></label><label>ROS 委托 ID<input type="search" id="mission-filter" placeholder="全部委托"></label><label>事件类型<input type="search" id="kind-filter" placeholder="全部类型" list="kind-options"></label><datalist id="kind-options"></datalist><button id="filter" class="primary">查询</button><button id="clear-filter">重置</button><a class="download" id="export" href="/api/export" download="edge-events.ndjson">导出 NDJSON ↓</a></div><details class="event-filters"><summary>按调用链、模块或触发来源筛选</summary><div class="filters"><label>调用链 ID<input type="search" id="trace-filter"></label><label>模块<input type="search" id="module-filter" placeholder="edge.gateway"></label><label>诊断码<input type="search" id="code-filter"></label><label>触发类型<input type="search" id="trigger-kind-filter" placeholder="watchdog"></label><label>触发 ID<input type="search" id="trigger-filter"></label></div></details><div id="event-rows"></div><div class="pager"><button id="newer">最新一页</button><span id="page-range">—</span><button id="older">更早事件</button></div></div></section>
</main>
<dialog id="event-modal" aria-labelledby="event-title"><div class="modal-heading"><h2 id="event-title">事件详情</h2><button id="close-modal" aria-label="关闭详情">×</button></div><p id="event-summary"></p><dl id="event-fields"></dl><details open><summary>结构化记录</summary><pre id="event-json"></pre></details><p id="replay-error" role="status"></p><button id="replay" class="primary">回放此时状态</button></dialog>
<dialog id="task-modal" aria-labelledby="task-title"><form id="task-form"><div class="modal-heading"><h2 id="task-title">下发自然语言任务</h2><button type="button" id="close-task" aria-label="关闭任务窗口">×</button></div><label for="task-text" class="task-label">任务说明</label><textarea id="task-text" rows="3" required maxlength="2048" placeholder="依次巡检 (0.8,0) 和 (0.8,0.7)，然后报告状态"></textarea><button id="task-example" type="button">填入巡检示例</button><div class="task-cap" id="cap-list"></div><p role="status" id="task-feedback"></p><button type="submit" class="primary" id="task-submit">下发任务</button></form></dialog>
</body></html>
