<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>探索地图回放</title>
<style>
:root{color-scheme:dark;--bg:#0c151c;--panel:#17242d;--line:#334652;--text:#e5f1ed;--muted:#a4babd;--green:#71e1ba;--orange:#ffb464}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Microsoft YaHei",system-ui,sans-serif}
main{max-width:1560px;margin:auto;padding:clamp(12px,2.5vw,38px)}header{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:clamp(24px,3.2vw,45px);line-height:1.13;letter-spacing:-.03em;margin:0 0 8px}h2{font-size:16px;margin:0 0 10px}p{margin:4px 0}
small,.muted{font-size:13px;color:var(--muted)}code,time,output{font-family:Consolas,monospace;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(240px,1fr);gap:12px}.card,aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.maphead,.mapfoot,.transport,.tools,.legend,.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.maphead,.mapfoot{padding:11px 16px;justify-content:space-between}.maphead{border-bottom:1px solid var(--line)}.maphead h2{margin:0}
.tools button{padding:3px 10px}.mapfoot{font-size:13px;color:var(--muted);border-top:1px solid var(--line)}.legend span::before{content:"";display:inline-block;width:9px;height:9px;background:var(--c);margin:0 5px 0 2px}
canvas{width:100%;height:clamp(320px,54vh,640px);display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
button,select{background:#223440;color:var(--text);border:1px solid #4b626d;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,canvas:focus-visible,select:focus-visible{outline:3px solid var(--green)}button[aria-pressed=true],button:hover{background:#30514d}button:disabled{opacity:.4;cursor:auto}
.transport{margin:14px 0}.transport input{flex:1;min-width:120px;accent-color:var(--green)}.transport output{color:var(--green);min-width:85px}.play{background:var(--green);color:#09241e;border:0;min-width:72px}
aside{padding:16px}.group+.group{border-top:1px solid var(--line);margin-top:17px;padding-top:17px}
.metric{font:600 clamp(25px,3vw,43px)/1.1 Consolas,monospace;color:var(--green);margin:6px 0}.change{color:var(--orange)}.smallgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#eventName{font-size:18px;line-height:1.5}.signal{display:flex;justify-content:space-between;gap:12px;padding:4px 0}.signal b{font:400 14px Consolas,monospace;color:var(--green)}
#camera img{width:100%;max-height:260px;object-fit:contain;background:#0a131a;border-radius:6px}details{margin-top:12px;overflow-wrap:anywhere}summary{cursor:pointer}
.nos{background:var(--panel);border-radius:12px;padding:22px}.nos li{margin:8px 0}a{color:var(--green)}[hidden]{display:none!important}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}canvas{height:52vh;min-height:300px}header{display:block}.identity{display:block;margin:8px 0}.tools{gap:5px}.transport input{order:3;flex-basis:100%}}
</style>
<main><header><div><h1 id="title"></h1><p class="muted" id="intro"></p></div><code class="muted identity" id="identity"></code></header>
<div class="transport" id="transport"><button class="play" id="play">播放</button><button id="prev">上次观测</button><button id="next">下次观测</button><input id="time" type="range" min="0" step="1" value="0" aria-label="任务时间"><output id="now"></output></div>
<div class="grid" id="grid"><section class="card"><div class="maphead"><h2>累计占据地图</h2><div class="tools"><button id="fit">适应整图</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="highlight" aria-pressed="true">本次变化</button></div></div>
<canvas id="map" tabindex="0" aria-label="可缩放和拖动的已观测地图"></canvas><div class="mapfoot"><div class="legend"><span style="--c:#bed8cb">自由</span><span style="--c:#db8e5d">占据</span><span style="--c:#314551">未知</span><span style="--c:#7eeac7">新增</span><span style="--c:#ffc67c">更新</span><span id="oldKey" style="--c:#8d84b6" hidden>底图</span></div><span id="geometry"></span></div></section>
<aside><div class="group"><h2 id="rev">等待观测</h2><div class="metric" id="known">0</div><p class="muted">累计已知格</p><p><span id="delta" class="change"></span></p><small id="when"></small></div>
<div class="group" id="event"><h2>任务事件</h2><p id="eventName"></p><p class="muted" id="why"></p></div>
<div class="group" id="mapFaults" hidden><p class="change" id="mapFault"></p><details><summary>查看异常观测</summary><div id="faultLinks"></div></details></div>
<div class="group" id="signalBox"><h2>观测与指令</h2><div id="signals"></div></div>
<div class="group" id="camera" hidden><label>图像 <select id="role"></select></label><div id="photo" hidden><img id="image" alt="当前时刻最近收到的图像"><small id="imageTime"></small></div></div>
<details id="meta"><summary>坐标与来源</summary><small id="source"></small></details><details id="saves" hidden><summary>查看各分段已保存的整图</summary><div id="savedLinks"></div></details></aside></div><section id="software" class="nos" hidden><h2>任务事件</h2><p class="muted">该录制没有地图观测。</p><ol id="events"></ol></section></main>
<script type="application/json" id="data">__MAP_PAYLOAD__</script>
<script>
"use strict";
const D=JSON.parse(document.getElementById("data").textContent), el=id=>document.getElementById(id);
const ctx=el("map").getContext("2d"), cells=new Map(), seed=new Set(); let cache=-1,segment=-1,hot=new Map(),t=0,zoom=1,dx=0,dy=0,changes=true,playing=false,raf=0,last=0,drag=null;
const raster=document.createElement("canvas");let rasterKey="";
const ix=(a,v)=>{let l=0,h=a.length;while(l<h){const m=(l+h)>>1;if(a[m].t<=v)l=m+1;else h=m}return l-1};
function reset(){cells.clear();seed.clear();hot.clear();segment=-1;cache=-1}
function install(r){if(r.segment!==segment){cells.clear();seed.clear();segment=r.segment;zoom=1;dx=dy=0}hot=new Map();for(const [x,y,v] of r.changes){const k=x+","+y;if(!D.saved)hot.set(k,cells.has(k)?"changed":"new");cells.set(k,[x,y,v]);if(r.base&&!D.saved)seed.add(k);else seed.delete(k)}}
function fit(){zoom=1;dx=dy=0;draw()}
function draw(){
 const cv=el("map"),rect=cv.getBoundingClientRect(),w=rect.width,h=rect.height,ratio=window.devicePixelRatio||1;
 if(!w||!h)return;
 if(cv.width!==Math.round(w*ratio)||cv.height!==Math.round(h*ratio)){cv.width=Math.round(w*ratio);cv.height=Math.round(h*ratio)}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle="#14242d";ctx.fillRect(0,0,w,h);
 const n=ix(D.revisions,t);if(n<cache)reset();
 for(let j=cache+1;j<=n;j++)install(D.revisions[j]);cache=n;
 if(n<0){ctx.fillStyle="#afc8c6";ctx.font="18px sans-serif";ctx.fillText("等待第一幅可用地图观测",30,h/2);return}
 const r=D.revisions[n];let b=r.fit||r.bounds;let cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
 const sc=Math.min(w*.84/Math.max(8,b[2]-b[0]),h*.82/Math.max(8,b[3]-b[1]))*zoom;
 const X=x=>w/2+(x-cx)*sc+dx,Y=y=>h/2-(y-cy)*sc+dy;
 const key=[n,cv.width,cv.height,ratio,zoom,dx,dy,changes].join("/");
 if(key!==rasterKey){
  raster.width=cv.width;raster.height=cv.height;const layer=raster.getContext("2d");layer.setTransform(ratio,0,0,ratio,0,0);
  layer.fillStyle="#314551";layer.fillRect(X(r.bounds[0]),Y(r.bounds[3]),(r.bounds[2]-r.bounds[0])*sc,(r.bounds[3]-r.bounds[1])*sc);
  for(const [k,[x,y,v]] of cells){let col=v<50?"#bed8cb":"#db8e5d";if(seed.has(k))col=v<50?"#8d84b6":"#d0a7a1";else if(changes&&hot.has(k))col=hot.get(k)==="new"?(v<50?"#7eeac7":"#be916d"):(v<50?"#ffc67c":"#f49a54");layer.fillStyle=col;const px=X(x),py=Y(y+1);layer.fillRect(Math.floor(px),Math.floor(py),Math.ceil(px+sc)-Math.floor(px),Math.ceil(py+sc)-Math.floor(py))}
  rasterKey=key;
 }ctx.drawImage(raster,0,0,w,h);
 const pi=ix(D.poses,t),pose=D.poses[pi],a=r.origin,c=Math.cos(a[2]),s=Math.sin(a[2]);
 function pos(p){const ox=p.xy[0]-a[0],oy=p.xy[1]-a[1];return [X((c*ox+s*oy)/r.resolution),Y((-s*ox+c*oy)/r.resolution)]}
 ctx.fillStyle="#467d8a";for(let j=pi;j>=0&&D.poses[j].segment===r.segment;j--){const [x,y]=pos(D.poses[j]);ctx.fillRect(x-1,y-1,2,2)}
 if(pose&&pose.frame===r.frame&&pose.segment===r.segment&&t-pose.t<1200){const [x,y]=pos(pose);
 ctx.save();ctx.translate(x,y);ctx.rotate(-pose.yaw+a[2]);ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-7,-6);ctx.lineTo(-5,0);ctx.lineTo(-7,6);ctx.closePath();ctx.fillStyle="#17292f";ctx.strokeStyle="#edffef";ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.restore()}
 const span=90*r.resolution/sc, pow=10**Math.floor(Math.log10(span)),scale=(span/pow>=5?5:span/pow>=2?2:1)*pow, length=scale*sc/r.resolution;
 ctx.fillStyle="#07151de8";ctx.fillRect(10,h-37,length+25,29);ctx.fillStyle="#e7f3ed";ctx.font="12px sans-serif";ctx.fillText(scale+" m",18,h-21);ctx.fillRect(18,h-15,length,2)
}
function setTime(ms){t=Math.max(0,Math.min(D.duration,ms));el("time").value=t;el("now").textContent=(t/1000).toFixed(1)+" s";const n=ix(D.revisions,t),r=D.revisions[n],ev=D.events[ix(D.events,t)];
 el("rev").textContent=r?(D.saved?"已保存整图":r.base?"已加载底图":"观测修订 "+r.revision)+" · 分段 "+r.segment:"等待观测";el("known").textContent=(r?r.known_cells:0).toLocaleString();
 el("delta").textContent=r?(D.saved?"已核对清单 SHA-256":r.base?"保存的参考底图":"新增 "+r.added+" 格 · 更新 "+r.updated+" 格"):"";
 el("when").textContent=r?"距该次地图观测 "+((t-r.t)/1000).toFixed(1)+" s":"";
 el("geometry").textContent=r?r.frame+" · "+r.resolution.toPrecision(3)+" m/格":"";
 el("source").textContent=r?"源时间 "+r.stamp_ns+" ns · 坐标原点 "+r.origin.map(v=>v.toFixed(2)).join(", ")+(r.reason?" · "+r.reason:"")+" · SHA-256 "+r.sha256:"";
 el("oldKey").hidden=D.saved||!r||!D.revisions.some(v=>v.segment===r.segment&&v.base&&v.t<=t);
 el("eventName").textContent=ev?ev.title:"等候首条事件";el("why").textContent=ev?ev.detail:"";
 const faults=D.diagnostics||[],fi=ix(faults,t),f=faults[fi];
 el("mapFaults").hidden=!faults.length;el("mapFault").textContent=f&&(!r||f.seq>(r.seq||0))?f.title+" · "+f.code:(fi+1)+" 条历史异常";
 el("signals").replaceChildren();for(const k of D.signals){const row=k.samples[ix(k.samples,t)],line=document.createElement("div"),val=document.createElement("b");line.className="signal";line.append(k.label);val.textContent=!row?"待采样":(row.value===null?row.status:row.text+" "+k.unit)+" · "+((t-row.t)/1000).toFixed(1)+" s"+((t-row.t)>k.max_age_s*1000?" 超时":"");line.append(val);el("signals").append(line)}
 const group=D.cameras[el("role").value];const shot=group&&group[ix(group,t)];el("photo").hidden=!group;
 if(shot){el("image").hidden=false;if(el("image").dataset.hash!==shot.hash){el("image").src=shot.src;el("image").dataset.hash=shot.hash}el("imageTime").textContent="录制样本预览 · "+((t-shot.t)/1000).toFixed(1)+" s 前"}else{el("image").hidden=true;el("imageTime").textContent="等待首帧"}
 draw()}
function stop(){playing=false;cancelAnimationFrame(raf);el("play").textContent=t>=D.duration?"重播":"播放"}
function tick(ts){if(!playing)return;if(last)setTime(t+ts-last);last=ts;if(t>=D.duration){stop();return}raf=requestAnimationFrame(tick)}
el("play").onclick=()=>{if(playing){stop();return}if(t>=D.duration)setTime(0);last=0;playing=true;el("play").textContent="暂停";raf=requestAnimationFrame(tick)};
el("time").oninput=e=>{stop();setTime(+e.target.value)};el("prev").onclick=()=>{stop();const n=ix(D.revisions,t-1);setTime(n<0?0:D.revisions[n].t)};
el("next").onclick=()=>{stop();const n=ix(D.revisions,t)+1;setTime(n<D.revisions.length?D.revisions[n].t:D.duration)};
el("fit").onclick=fit;function z(f){zoom=Math.max(.25,Math.min(20,zoom*f));draw()}
el("plus").onclick=()=>z(1.3);el("minus").onclick=()=>z(1/1.3);el("highlight").onclick=()=>{changes=!changes;el("highlight").setAttribute("aria-pressed",changes);draw()};
el("map").onwheel=e=>{e.preventDefault();z(e.deltaY<0?1.12:1/1.12)};
el("map").onpointerdown=e=>{drag=[e.clientX,e.clientY];el("map").setPointerCapture(e.pointerId)};
el("map").onpointermove=e=>{if(drag){dx+=e.clientX-drag[0];dy+=e.clientY-drag[1];drag=[e.clientX,e.clientY];draw()}};el("map").onpointerup=el("map").onpointercancel=()=>drag=null;
el("map").onkeydown=e=>{if(e.key==="+")z(1.3);else if(e.key==="-")z(1/1.3);else if(e.key==="Home")fit();else if(e.key==="ArrowRight")el("next").click();else if(e.key==="ArrowLeft")el("prev").click();else return;e.preventDefault()};
el("title").textContent=D.title;el("intro").textContent=D.description;el("identity").textContent=D.task_id;el("time").max=D.duration;
el("signalBox").hidden=!D.signals.length;el("event").hidden=!D.events.length;el("camera").hidden=!Object.keys(D.cameras).length;
for(const [id,label] of [["","隐藏图像"],["onboard","车载相机"],["overview_sim","场外观察 · 仿真"],["overview","场外相机"],["unknown","录制相机 · 来源未标注"]]){
 if(id&&!D.cameras[id])continue;const o=document.createElement("option");o.value=id;o.textContent=label;el("role").append(o)}
el("role").onchange=()=>setTime(t);
for(const m of D.saved_maps||[]){el("saves").hidden=false;const p=document.createElement("p"),a=document.createElement("a");a.href=m.folder+"/index.html";a.textContent="分段 "+m.segment+" · 终态整图";p.append(a);el("savedLinks").append(p)}
for(const f of D.diagnostics||[]){const p=document.createElement("p"),b=document.createElement("button");b.textContent="定位 #"+f.seq+" · "+f.code;b.onclick=()=>{stop();setTime(f.t)};p.append(b,document.createTextNode(" "+f.detail));el("faultLinks").append(p)}
if(!D.revisions.length&&!D.diagnostics?.length){el("grid").hidden=true;el("transport").hidden=true;el("software").hidden=false;for(const e of D.events){const li=document.createElement("li");li.textContent=(e.t/1000).toFixed(1)+" s · "+e.title;el("events").append(li)}}
if(D.saved){el("transport").hidden=true;el("highlight").hidden=true}window.addEventListener("resize",draw);setTime(0);
</script></html>
