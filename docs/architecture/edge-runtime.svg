.title{font-size:38px;font-weight:700}.lead{font-size:19px}.section{font-size:24px;font-weight:700}.card-title{font-size:23px;font-weight:650}.body{font-size:17px}.kicker{font-size:14px;font-weight:650;letter-spacing:.4px}.hint{font-size:15px;font-weight:550}.caption{font-size:16px}
.wire{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}.command{stroke:#0E7165}.sense{stroke:#915F24;stroke-dasharray:9 3 2 3}.sync{stroke:#385CAB;stroke-dasharray:7 5}.store{stroke:#687A80;stroke-width:1.9}
</style>
