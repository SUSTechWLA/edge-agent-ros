services:
  calibration-model:
    image: ${EDGE_CAL_MODEL_IMAGE:-ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592}
    pull_policy: never
    gpus: all
    environment:
      OLLAMA_MODELS: /model-cache/models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NOPRUNE: "true"
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_FLASH_ATTENTION: "${EDGE_OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_KV_CACHE_TYPE: "${EDGE_OLLAMA_KV_CACHE_TYPE:-q8_0}"
      OLLAMA_NUM_PARALLEL: "${EDGE_OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_KEEP_ALIVE: "${EDGE_OLLAMA_KEEP_ALIVE:-30m}"
    volumes:
      - board-model-cache:/model-cache:ro
volumes:
  board-model-cache:
    external: true
    name: ${EDGE_CAL_MODEL_VOLUME:-p0-author-replay-model}
