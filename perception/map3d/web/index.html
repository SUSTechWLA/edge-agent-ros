<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>环境地图 · Edge Agent ROS</title>
  <link rel="stylesheet" href="/map.css">
  <script defer src="/grid.js"></script><script defer src="/planar.js"></script>
  <script defer src="/mesh.js"></script><script defer src="/spatial.js"></script><script defer src="/texture.js"></script><script defer src="/map.js"></script>
</head>
<body>
<header><div class="brand"><i aria-hidden="true">⬡</i> Edge Agent <b>ROS</b></div><span class="bar"></span><span>感知工作台</span>
  <nav id="workbench" data-port="__CONSOLE_PORT__" aria-label="任务与回溯" hidden>
    <a data-page="/campus-mission.html">校园任务</a>
    <a data-view="sessions">任务会话</a><a data-view="review">运行复盘</a><a data-view="events">事件记录</a>
  </nav>
</header>
<main>
  <div class="title">
    <div><p id="env">ROS 2</p><h1 id="map-title">环境地图</h1></div>
    <div class="modes" role="group" aria-label="地图视图">
      <button id="mode-planar" type="button" aria-pressed="false" aria-controls="planar-viewport"><b>2D</b> 平面地图</button>
      <button id="mode-spatial" type="button" aria-pressed="true" aria-controls="viewport"><b>3D</b> 空间地图</button>
    </div>
  </div>
  <div class="layout">
    <section class="view" aria-label="交互地图">
      <div class="view-head"><span id="view-name">三维透视</span><code id="frame">坐标系 —</code></div>
      <div class="map-places" id="map-places" hidden>
        <button id="campus-fit" type="button">完整范围</button>
        <span id="landmarks"></span>
        <button id="robot-fit" type="button">机器人附近</button>
        <label for="place-fit">地点</label><select id="place-fit" aria-label="按校园地点取景"></select>
      </div>
      <div class="plot">
        <canvas tabindex="0" id="viewport" aria-label="三维空间地图" aria-describedby="gestures"></canvas>
        <canvas tabindex="0" id="planar-viewport" aria-label="二维占据与语义地图" aria-describedby="gestures" hidden></canvas>
        <div class="mission-route-key" id="mission-route-key" hidden>
          <span id="mission-global"></span><span id="mission-local"></span>
          <button type="button" id="mission-fit" hidden>定位路线</button>
        </div>
        <div id="empty" role="status">等待地图数据</div>
        <div class="height" id="height-key"><small>点云高度 · m</small><i></i><div><span id="z-min">—</span><span id="z-max">—</span></div></div>
        <div id="grid-key" class="grid-key" hidden><span><i class="unknown"></i>未知</span><span><i class="free"></i>空闲</span><span><i class="occupied"></i>占据</span></div>
        <div id="map-attribution" hidden></div>
      </div>
      <div class="foot">
        <span id="gestures"></span><div class="buttons">
          <button id="zoom-out" aria-label="缩小" type="button">−</button><button id="zoom-in" aria-label="放大" type="button">＋</button>
          <button id="view-top" type="button">俯视</button><button id="orbit-reset" type="button">适应视图</button>
        </div>
      </div>
    </section>
    <aside>
      <section class="panel" id="robot-panel" hidden>
        <div class="panel-head"><h2>场内机器人</h2><span id="robot-online"></span></div>
        <div id="robot-choices" role="group" aria-label="查看机器人机体"></div>
        <p id="robot-detail" aria-live="polite">选择机体，查看实时位置和可用能力。</p>
        <a id="robot-camera" hidden target="_blank" rel="noopener noreferrer">查看 Gazebo 原生画面</a>
      </section>
      <section class="panel inspect"><div class="panel-head"><h2>地图查询</h2><span class="live" id="connection" role="status">正在连接</span></div>
        <p id="pick-result" aria-live="polite"></p>
        <p id="grid-info"></p>
      </section>
      <section class="panel"><h2>可见图层</h2>
        <label id="texture-row" hidden><input type="checkbox" id="layer-texture" checked><i class="key texture"></i>校园仿真外观</label>
        <p id="texture-info" hidden role="status"></p>
        <label id="route-row" hidden><input type="checkbox" id="layer-route" checked><i class="key route"></i><span id="route-label">已核查测试步道</span></label>
        <button id="route-fit" type="button" hidden>查看整条步道</button>
        <label><input type="checkbox" id="layer-grid" checked><i class="key grid"></i>占据栅格</label>
        <label><input type="checkbox" id="layer-scene" checked><i class="key scene"></i>语义地图</label>
        <label class="sub" id="roof-row"><input type="checkbox" id="layer-roof">显示语义屋顶</label>
        <label><input type="checkbox" id="layer-cloud" checked><i class="key points"></i><span id="cloud-label">实测点云</span></label>
        <div id="lidar-sources" aria-label="附加雷达来源"></div>
        <label><input type="checkbox" id="layer-pose" checked><i class="key robot"></i>机器人位姿</label>
      </section>
      <section class="panel"><div class="panel-head"><h2>点云来源</h2><span id="cloud-status">等待</span></div>
        <div class="count"><strong id="point-count">0</strong><span>已保留体素</span></div>
        <label id="inspect-source-row" hidden>来源 <select id="inspect-source"></select></label>
        <dl><dt>传感器</dt><dd id="sensor">等待数据</dd><dt>点云话题</dt><dd><code id="topic">—</code></dd><dt>采样时刻</dt><dd id="sample">—</dd><dt>体素边长</dt><dd id="resolution">—</dd></dl>
        <p id="sources"></p>
      </section>
    </aside>
  </div>
</main></body></html>
