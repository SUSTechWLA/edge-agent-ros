<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB-D 像素测距 · Edge Agent ROS</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:#e9f1f0;background:#0c1719;--line:#334447;--muted:#a7bbba;--mint:#7ce1be}
*{box-sizing:border-box}body{margin:0}main{max-width:1170px;margin:auto;padding:38px clamp(16px,4vw,54px) 36px}header{display:flex;align-items:start;justify-content:space-between;gap:16px}.brand{font:600 12px ui-monospace,monospace;color:var(--mint);letter-spacing:.1em}h1{font-size:clamp(28px,4vw,48px);font-weight:630;margin:10px 0 8px;letter-spacing:-.045em}p{margin:0;color:var(--muted);line-height:1.65}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;white-space:nowrap;border:1px solid var(--line);border-radius:24px;color:#e9c589;font-size:13px}.status:before{content:"";width:8px;height:8px;background:currentColor;border-radius:50%}.status[data-state=online]{color:var(--mint)}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:26px}figure{margin:0;border:1px solid var(--line);background:#142325;border-radius:14px;overflow:hidden}figcaption{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600}.sub{font:12px ui-monospace,monospace;color:var(--muted)}.picture{position:relative;background:#071315;display:grid;place-items:center;min-height:90px}.picture:empty{aspect-ratio:4/3}.picture img{display:block;width:100%;height:auto;cursor:crosshair}.picture img:not([src]){display:none}.picture:has(img:not([src])){aspect-ratio:4/3}.marker{position:absolute;pointer-events:none;width:16px;height:16px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 2px #152429;border-radius:50%}[hidden]{display:none!important}
.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.readout,.legend{padding:15px 18px;background:#172a2b;border-radius:12px}.readout small,.legend small{color:var(--muted)}#pixel-value{display:block;margin-top:7px;font-weight:620;color:#f1f6f2;font-variant-numeric:tabular-nums}.scale{width:100%;height:7px;background:linear-gradient(90deg,#fac842,#df5c3a,#5a57a6,#2492a6,#213f62);margin:10px 0 5px;border-radius:5px}.ticks{display:flex;justify-content:space-between;color:var(--muted);font:11px ui-monospace,monospace}details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--muted)}summary{cursor:pointer;color:#d4e3df}dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 15px;font-size:13px}dt,dd{margin:0;overflow-wrap:anywhere}dd{font-family:ui-monospace,monospace}
@media (max-width:700px){main{padding-top:22px}.views,.details{grid-template-columns:1fr}.views{gap:12px}header{flex-wrap:wrap}h1{font-size:32px}}
</style></head>
<body><main><header><div><div class="brand">EDGE AGENT ROS</div><h1>RGB-D 像素测距</h1><p>点击彩色图或深度图的同一位置，读取沿相机光轴的距离。</p></div><span id="status" class="status">等待相机</span></header>
<div class="views"><figure><figcaption>彩色图像 <span class="sub">RGB</span></figcaption><div class="picture"><img id="color-image" alt="可点击取样的彩色图像"><i hidden class="marker"></i></div></figure>
<figure><figcaption>对齐深度 <span class="sub" id="encoding">DEPTH</span></figcaption><div class="picture"><img id="depth-image" alt="以颜色表示沿光轴深度的图像"><i hidden class="marker"></i></div></figure></div>
<div class="details"><div class="readout" aria-live="polite"><small>像素测量 · 米</small><output id="pixel-value">等待选取像素</output></div><div class="legend"><small>深度色标 · 黑色表示无回波</small><div class="scale"></div><div class="ticks"><span>0 m</span><span>1.5</span><span>3</span><span>4.5</span><span>≥6 m</span></div></div></div>
<details open><summary>配准与来源</summary><dl id="metadata"></dl></details></main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const images = [$("color-image"), $("depth-image")], markers = [...document.querySelectorAll(".marker")];
let displayed, selected, requestNumber = 0;
const descriptions = {online:"配准有效",waiting:"等待数据",invalid:"配准无效",stale:"数据过期",offline:"服务离线"};
const reasons = {waiting_for_streams:"等待三路数据",timestamp_skew:"时间差过大",frame_mismatch:"坐标系不同",size_mismatch:"分辨率不同",invalid_intrinsics:"相机内参无效",stream_timeout:"数据流中断",clock_reset:"时钟已重置",stamp_outside_clock:"时间戳与当前时钟不符"};
function state(value,reason) {
  $("status").dataset.state=value;
  $("status").textContent=(descriptions[value]||value)+(value==="online"||!reason?"":" · "+(reasons[reason]||reason));
}
function metadata(s) {
  const a=s.sources||{};
  const rows=[["来源",a.id],["配准声明",({gazebo_shared_optical_projection:"Gazebo 同一光学投影",driver_aligned_to_color:"驱动已对齐到彩色图"})[a.alignment]],
    ["坐标系",s.frame],["采样",s.width&&s.width+" × "+s.height+" px · Δt "+s.skew_ms.toFixed(2)+" ms"],
    ["彩色",a.color_topic],["深度",a.aligned_depth_topic],["内参",a.info_topic],["彩色时间戳 / ns",s.stamp_ns_text?.color]];
  const items=[];
  for (const [k,v] of rows) if (v!==undefined&&v!==null) {
    const dt=document.createElement("dt"), dd=document.createElement("dd");
    dt.textContent=k; dd.textContent=v; items.push(dt,dd);
  }
  $("metadata").replaceChildren(...items);
}
function clearDisplay(){
  displayed=null;selected=null; requestNumber++;
  images.forEach(img=>img.removeAttribute("src"));markers.forEach(m=>m.hidden=true);
  $("pixel-value").textContent="等待可配准的数据";
}
async function loadImage(url) {
  const img = new Image();img.src=url;await img.decode();return img;
}
async function measure() {
  if (!selected||!displayed) return;
  const {u,v} = selected, pair=displayed.pair_id, req=++requestNumber;
  markers.forEach(m=>{m.style.left=(u+.5)/displayed.width*100+"%";m.style.top=(v+.5)/displayed.height*100+"%";m.hidden=false;});
  try {
    const r = await fetch("/api/sample?u="+u+"&v="+v+"&pair="+encodeURIComponent(pair));
    const data=await r.json();
    if (req!==requestNumber || displayed?.pair_id!==pair) return;
    const prefix="("+u+", "+v+") · ";
    $("pixel-value").textContent=prefix+(r.ok?data.depth_m.toFixed(3)+" m · RGB "+data.rgb.join(", "):r.status===422?"无有效回波":"帧已过期");
  } catch { if (req===requestNumber) $("pixel-value").textContent="测量暂不可用"; }
}
images.forEach(initial=>initial.parentElement.addEventListener("click",e=>{
  const img=e.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (!displayed) return;
  const box=img.getBoundingClientRect(), step=Math.max(1,Math.ceil(displayed.width/640),Math.ceil(displayed.height/480));
  const coordinate=(position,origin,length,res,source)=>Math.min(source-1,Math.max(0,Math.floor((position-origin)/length*res)*step));
  selected={u:coordinate(e.clientX,box.left,box.width,img.naturalWidth,displayed.width),v:coordinate(e.clientY,box.top,box.height,img.naturalHeight,displayed.height)};
  measure();
}));
async function poll() {
  try {
    const response=await fetch("/api/rgbd",{cache:"no-store"});if(!response.ok)throw Error();
    const s=await response.json();state(s.status,s.reason);metadata(s);
    if(s.status!=="online"){clearDisplay();return;}
    if(displayed?.pair_id===s.pair_id) return;
    const pair=encodeURIComponent(s.pair_id);
    const loaded=await Promise.all(["color","depth"].map(k=>loadImage("/frame/"+k+".png?pair="+pair)));
    images.forEach((img,i)=>{
      loaded[i].id=img.id; loaded[i].alt=img.alt;
      img.replaceWith(loaded[i]); images[i]=loaded[i];
    }); displayed=s;
    $("encoding").textContent=s.depth_encoding;
    if (selected&&selected.u<s.width&&selected.v<s.height) await measure();
    else { selected=null;markers.forEach(m=>m.hidden=true);$("pixel-value").textContent="等待选取像素"; }
  } catch {state("offline");clearDisplay();}
  finally {setTimeout(poll,400);}
}
poll();
</script></body></html>
